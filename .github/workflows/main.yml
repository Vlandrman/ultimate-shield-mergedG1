name: Build Signed Updatable APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Unzip & Build Signed APK
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE ..."
            unzip -q "$ZIP_FILE" -d ./src_work
          fi
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          echo "Building project in: $PROJ_DIR"
          cd "$PROJ_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload Updatable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateShield-Signed-APK
          path: "**/app/build/outputs/apk/release/*.apk"
